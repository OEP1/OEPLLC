<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Payments — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101a26; --chart:#f2f5f7; --rule:#c9d6df;
    --teal:#0f6f72; --flag:#b8541c; --muted:#5d6f7d; --pale:#eef2f4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--chart);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.55;
    background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(15,111,114,.06) 31px 32px)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}

  header{border-bottom:2px solid var(--ink);margin-bottom:22px;padding:30px 0 16px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  h1{font-family:Archivo,sans-serif;font-weight:800;font-size:27px;letter-spacing:-.02em;margin:0}
  .corpus{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);
    letter-spacing:.05em;text-align:right;line-height:1.7}
  .corpus b{color:var(--ink)}

  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin-bottom:20px}
  .tab{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;padding:0 0 10px;background:none;border:0;color:var(--muted);cursor:pointer}
  .tab[aria-selected=true]{color:var(--ink);box-shadow:0 2px 0 var(--flag)}

  .filters{background:#fff;border:1px solid var(--rule);padding:14px 16px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
  .fld{display:flex;flex-direction:column;gap:4px}
  label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted)}
  select,input{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--rule);background:#fff}
  select:focus,input:focus{outline:2px solid var(--teal);outline-offset:1px}
  .count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;
    border:1px solid var(--rule)}
  th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;
    border-bottom:1px solid var(--rule);padding:9px 12px;cursor:pointer;white-space:nowrap}
  th:hover{color:var(--ink)}
  th.on{color:var(--flag)}
  td{padding:10px 12px;border-bottom:1px solid var(--pale);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#fafcfd}
  .num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap}
  .rk{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:12px}
  .nm{font-weight:500}
  .sub{color:var(--muted);font-size:12.5px}

  .mini{display:inline-block;width:52px;height:7px;background:var(--pale);vertical-align:middle}
  .mini i{display:block;height:7px;background:var(--teal);opacity:.5}

  .panel{background:#fff;border:1px solid var(--rule);padding:24px;margin-bottom:14px}
  .panel h2{font-family:Archivo,sans-serif;font-size:25px;margin:0 0 3px;letter-spacing:-.02em}
  .idline{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:20px}
  h4{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin:24px 0 11px;font-weight:600}
  h4:first-of-type{margin-top:0}

  .mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px}
  .mcell{background:#fff;padding:12px 14px;box-shadow:0 0 0 1px var(--rule)}
  .mcell .v{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600}
  .mcell .v.flag{color:var(--flag)}
  .mcell .l{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin-top:2px}
  .mcell .d{font-size:12px;color:var(--muted);margin-top:4px}

  .spine{display:flex;flex-direction:column;gap:8px}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:center}
  .bar .track{position:relative;height:25px;background:var(--pale);overflow:hidden;min-width:0}
  .bar .fill{position:absolute;inset:0 auto 0 0;background:var(--teal);opacity:.16}
  .bar .lab{position:relative;padding:3px 9px;font-size:13px;line-height:19px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bar .amt{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right}

  /* Signature: the curve showing how concentrated a company's spending is */
  .lorenz{background:#fff;border:1px solid var(--rule);padding:18px 20px}
  .lorenz svg{width:100%;height:190px;display:block}
  .lorenz .cap{font-size:12.5px;color:var(--muted);margin-top:10px}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 8px;
    background:var(--pale);color:var(--ink)}
  .chip.warn{background:#f6e7dc;color:var(--flag)}

  .back{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;background:none;border:0;color:var(--teal);cursor:pointer;
    padding:0;margin-bottom:14px}
  .note{border-left:3px solid var(--flag);background:#fff;padding:12px 15px;
    font-size:13px;color:var(--muted);margin-top:22px}
  .mock{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--flag);border:1px solid var(--flag);
    padding:2px 7px;display:inline-block}
  @media(max-width:640px){.corpus{text-align:left}th,td{padding:8px}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>Open Payments</h1>
    <span class="mock">Prototype · illustrative data</span>
  </div>
  <div class="corpus">
    Local corpus &nbsp;<b>Florida · 2025</b><br>
    <b>1,284,507</b> payments · <b>41,338</b> providers · <b>892</b> companies<br>
    ingested 18 Aug 2026 · queries run offline
  </div>
</header>

<div class="tabs">
  <button class="tab" data-v="companies" aria-selected="true">Companies</button>
  <button class="tab" data-v="providers" aria-selected="false">Providers</button>
  <button class="tab" data-v="overlap" aria-selected="false">Shared recipients</button>
</div>

<div id="app"></div>

</div>

<script>
// ---------------------------------------------------------------------------
// Illustrative data. Shapes mirror what a local ingest would produce.
// ---------------------------------------------------------------------------
const COMPANIES = [
  {name:"Solventum Corporation", spend:48250110, docs:3120, top10:.41, spec:"Cardiovascular Disease",
   natures:[["Compensation for services",21400000],["Food and Beverage",12900000],["Consulting Fee",8100000],["Travel and Lodging",5850110]],
   specs:[["Cardiovascular Disease",18900000],["Internal Medicine",11200000],["Orthopaedic Surgery",8400000],["Neurology",5300000],["Urology",4450110]],
   top:[["Eldin, A M",344685],["Vasquez, R",298400],["Chen, L",241900],["Okafor, N",220150],["Reyes, D",198700]]},
  {name:"Neuronetics, Inc.", spend:9880400, docs:412, top10:.68, spec:"Psychiatry",
   natures:[["Compensation for services",5100000],["Consulting Fee",2400000],["Food and Beverage",1580400],["Travel and Lodging",800000]],
   specs:[["Psychiatry",7200000],["Neurology",1600000],["Internal Medicine",680400],["Family Medicine",400000]],
   top:[["Whitfield, S",412300],["Marchetti, P",366100],["Doyle, K",291800],["Ibrahim, A",244000],["Novak, T",210500]]},
  {name:"Avita Medical Americas, LLC", spend:6120880, docs:288, top10:.72, spec:"Plastic Surgery",
   natures:[["Compensation for services",3400000],["Consulting Fee",1600000],["Food and Beverage",720880],["Travel and Lodging",400000]],
   specs:[["Plastic Surgery",3900000],["General Surgery",1100000],["Dermatology",720880],["Emergency Medicine",400000]],
   top:[["Barrow, J",388000],["Lindqvist, M",301400],["Ferrer, C",255900],["Adeyemi, O",210000],["Kaur, S",188600]]},
  {name:"Vifor Pharma, Inc.", spend:14402300, docs:1840, top10:.29, spec:"Nephrology",
   natures:[["Food and Beverage",6100000],["Compensation for services",4900000],["Consulting Fee",2200000],["Travel and Lodging",1202300]],
   specs:[["Nephrology",8100000],["Internal Medicine",3400000],["Cardiovascular Disease",1900000],["Hematology & Oncology",1002300]],
   top:[["Petrov, I",180400],["Hall, R",166200],["Nguyen, T",151800],["Osei, K",140900],["Brandt, L",132000]]},
  {name:"ZOLL Services LLC", spend:11740600, docs:2240, top10:.24, spec:"Cardiovascular Disease",
   natures:[["Food and Beverage",5800000],["Compensation for services",3100000],["Consulting Fee",1900000],["Travel and Lodging",940600]],
   specs:[["Cardiovascular Disease",6900000],["Emergency Medicine",2100000],["Internal Medicine",1740600],["Critical Care",1000000]],
   top:[["Delgado, M",128400],["Fitzgerald, A",119000],["Ono, H",108300],["Bauer, S",99800],["Ali, Z",94200]]},
  {name:"Remington Medical, Inc.", spend:3980200, docs:96, top10:.84, spec:"Orthopaedic Surgery",
   natures:[["Consulting Fee",2100000],["Compensation for services",1300000],["Travel and Lodging",380200],["Food and Beverage",200000]],
   specs:[["Orthopaedic Surgery",3100000],["Sports Medicine",480200],["Physical Medicine",400000]],
   top:[["Salvatore, D",610000],["Kim, J",488000],["Prieto, R",402000],["Nash, W",311500],["Oduya, B",264000]]},
];

const PROVIDERS = [
  {name:"Eldin, A M",npi:"1225224686",spec:"Cardiovascular Disease",city:"Brooksville",total:696449,n:6021,svc:65,top:"Solventum Corporation",share:49.5,cos:8,type:"Organization"},
  {name:"Salvatore, D",npi:"1447209833",spec:"Orthopaedic Surgery",city:"Naples",total:642100,n:284,svc:88,top:"Remington Medical, Inc.",share:95.0,cos:3,type:"Individual"},
  {name:"Whitfield, S",npi:"1093778210",spec:"Psychiatry",city:"Tampa",total:498320,n:412,svc:79,top:"Neuronetics, Inc.",share:82.7,cos:5,type:"Individual"},
  {name:"Barrow, J",npi:"1710338204",spec:"Plastic Surgery",city:"Miami",total:441880,n:198,svc:84,top:"Avita Medical Americas, LLC",share:87.8,cos:4,type:"Individual"},
  {name:"Vasquez, R",npi:"1558102947",spec:"Cardiovascular Disease",city:"Orlando",total:398400,n:1104,svc:52,top:"Solventum Corporation",share:74.9,cos:11,type:"Individual"},
  {name:"Marchetti, P",npi:"1366220118",spec:"Psychiatry",city:"Jacksonville",total:366100,n:322,svc:71,top:"Neuronetics, Inc.",share:100,cos:1,type:"Individual"},
  {name:"Chen, L",npi:"1902447761",spec:"Internal Medicine",city:"Tampa",total:341900,n:889,svc:44,top:"Solventum Corporation",share:70.8,cos:9,type:"Individual"},
  {name:"Lindqvist, M",npi:"1275309442",spec:"Plastic Surgery",city:"Fort Lauderdale",total:301400,n:141,svc:81,top:"Avita Medical Americas, LLC",share:100,cos:1,type:"Individual"},
  {name:"Okafor, N",npi:"1639118025",spec:"Urology",city:"Sarasota",total:290150,n:640,svc:38,top:"Solventum Corporation",share:75.9,cos:7,type:"Individual"},
  {name:"Doyle, K",npi:"1820773159",spec:"Neurology",city:"Tampa",total:291800,n:266,svc:76,top:"Neuronetics, Inc.",share:100,cos:1,type:"Individual"},
];

const OVERLAP = [
  {a:"Solventum Corporation",b:"ZOLL Services LLC",shared:284,note:"Both concentrated in cardiovascular"},
  {a:"Solventum Corporation",b:"Vifor Pharma, Inc.",shared:196,note:"Overlap through internal medicine"},
  {a:"Neuronetics, Inc.",b:"Solventum Corporation",shared:41,note:"Limited overlap"},
  {a:"Avita Medical Americas, LLC",b:"Remington Medical, Inc.",shared:18,note:"Surgical specialties"},
  {a:"Vifor Pharma, Inc.",b:"ZOLL Services LLC",shared:154,note:"Shared cardiology recipients"},
];

// ---------------------------------------------------------------------------
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view = 'companies', sortKey = 'spend', sortDir = -1;
let f = {spec:'', city:'', type:'', min:0, nature:''};

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x===t));
  view = t.dataset.v;
  sortKey = view==='companies' ? 'spend' : view==='providers' ? 'total' : 'shared';
  sortDir = -1; render();
});

function sortRows(rows){
  return rows.slice().sort((x,y)=>{
    const a=x[sortKey], b=y[sortKey];
    if (typeof a === 'string') return sortDir * a.localeCompare(b);
    return sortDir * (a-b);
  });
}
function th(key,label,cls){
  return `<th class="${sortKey===key?'on':''} ${cls||''}" onclick="setSort('${key}')">${label}${
    sortKey===key ? (sortDir<0?' ↓':' ↑') : ''}</th>`;
}
window.setSort = k => { sortDir = (sortKey===k) ? -sortDir : -1; sortKey = k; render(); };

// --- companies -------------------------------------------------------------
function companiesView(){
  let rows = COMPANIES.filter(c =>
    (!f.spec || c.spec===f.spec) && c.spend >= f.min);
  rows = sortRows(rows);
  const max = Math.max(...COMPANIES.map(c=>c.spend));

  const specs = [...new Set(COMPANIES.map(c=>c.spec))].sort();
  return `
  <div class="filters">
    <div class="fld"><label>Concentrated in</label>
      <select onchange="f.spec=this.value;render()">
        <option value="">Any specialty</option>
        ${specs.map(s=>`<option ${f.spec===s?'selected':''}>${esc(s)}</option>`).join('')}
      </select></div>
    <div class="fld"><label>Minimum spend</label>
      <select onchange="f.min=+this.value;render()">
        ${[0,5000000,10000000].map(v=>`<option value="${v}" ${f.min===v?'selected':''}>${
          v?money(v)+'+':'Any'}</option>`).join('')}
      </select></div>
    <span class="count">${rows.length} of ${COMPANIES.length} companies</span>
  </div>
  <table>
    <thead><tr>
      <th>#</th>${th('name','Company')}${th('spend','Total spend','num')}
      ${th('docs','Providers paid','num')}${th('top10','Top-10 share','num')}
      <th>Concentration</th>
    </tr></thead>
    <tbody>${rows.map((c,i)=>`
      <tr onclick="openCompany('${esc(c.name)}')">
        <td class="rk">${String(i+1).padStart(2,'0')}</td>
        <td><span class="nm">${esc(c.name)}</span>
          <div class="sub">Mostly ${esc(c.spec)}</div></td>
        <td class="num">${money(c.spend)}</td>
        <td class="num">${c.docs.toLocaleString()}</td>
        <td class="num">${Math.round(c.top10*100)}%</td>
        <td><span class="mini"><i style="width:${c.top10*100}%"></i></span></td>
      </tr>`).join('')}</tbody>
  </table>
  <div class="note">Top-10 share is the fraction of a company's money going to
    its ten largest recipients. A low number is a broad marketing program; a high
    one is a small set of deep relationships.</div>`;
}

window.openCompany = name => {
  const c = COMPANIES.find(x=>x.name===name);
  const maxN = Math.max(...c.natures.map(x=>x[1]));
  const maxS = Math.max(...c.specs.map(x=>x[1]));
  const svc = c.natures.filter(n=>/compensation|consulting/i.test(n[0]))
                       .reduce((a,b)=>a+b[1],0);
  app.innerHTML = `
    <button class="back" onclick="render()">← All companies</button>
    <div class="panel">
      <h2>${esc(c.name)}</h2>
      <div class="idline">Florida · 2025 · ${c.docs.toLocaleString()} providers paid</div>

      <div class="mgrid">
        <div class="mcell"><div class="v flag">${money(c.spend)}</div><div class="l">Total spend</div></div>
        <div class="mcell"><div class="v">${money(c.spend/c.docs)}</div><div class="l">Per provider</div>
          <div class="d">Average across all recipients</div></div>
        <div class="mcell"><div class="v">${Math.round(c.top10*100)}%</div><div class="l">To top 10</div>
          <div class="d">${c.top10>.6?'Highly concentrated':'Broadly distributed'}</div></div>
        <div class="mcell"><div class="v">${Math.round(svc/c.spend*100)}%</div><div class="l">Fees for services</div>
          <div class="d">Speaking and consulting</div></div>
      </div>

      <h4>How concentrated the spending is</h4>
      <div class="lorenz">
        ${lorenz(c.top10)}
        <div class="cap">Each point is the share of dollars going to that share of
          recipients. The further the curve bends from the diagonal, the more the
          money sits with a few providers.</div>
      </div>

      <h4>Where the money goes by specialty</h4>
      <div class="spine">${c.specs.map(([l,v])=>bar(l,v,maxS)).join('')}</div>

      <h4>What it is paid for</h4>
      <div class="spine">${c.natures.map(([l,v])=>bar(l,v,maxN)).join('')}</div>

      <h4>Largest recipients</h4>
      <table><thead><tr><th>#</th><th>Provider</th><th class="num">Received</th>
        <th class="num">Share of company total</th></tr></thead>
        <tbody>${c.top.map((t,i)=>`<tr><td class="rk">${String(i+1).padStart(2,'0')}</td>
          <td class="nm">${esc(t[0])}</td><td class="num">${money(t[1])}</td>
          <td class="num">${(t[1]/c.spend*100).toFixed(2)}%</td></tr>`).join('')}</tbody></table>
    </div>`;
};

function bar(label,val,max){
  return `<div class="bar"><div class="track">
    <div class="fill" style="width:${val/max*100}%"></div>
    <div class="lab" title="${esc(label)}">${esc(label)}</div></div>
    <div class="amt">${money(val)}</div></div>`;
}

function lorenz(top10){
  // Curve shaped so the top 10% of recipients hold `top10` of the dollars.
  const W=100,H=100, pts=[];
  const k = Math.log(top10)/Math.log(0.10);
  for(let i=0;i<=20;i++){ const x=i/20; pts.push([x*W, H - Math.pow(x,1/k)*H]); }
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L100,100 Z" fill="var(--teal)" opacity=".12"/>
    <line x1="0" y1="100" x2="100" y2="0" stroke="var(--rule)" stroke-width=".8"
          stroke-dasharray="2,2"/>
    <path d="${d}" fill="none" stroke="var(--teal)" stroke-width="1.4"/>
  </svg>`;
}

// --- providers -------------------------------------------------------------
function providersView(){
  let rows = PROVIDERS.filter(p =>
    (!f.spec || p.spec===f.spec) && (!f.city || p.city===f.city) &&
    (!f.type || p.type===f.type) && p.total >= f.min);
  rows = sortRows(rows);
  const specs=[...new Set(PROVIDERS.map(p=>p.spec))].sort();
  const cities=[...new Set(PROVIDERS.map(p=>p.city))].sort();
  return `
  <div class="filters">
    <div class="fld"><label>Specialty</label>
      <select onchange="f.spec=this.value;render()"><option value="">Any</option>
      ${specs.map(s=>`<option ${f.spec===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
    <div class="fld"><label>City</label>
      <select onchange="f.city=this.value;render()"><option value="">Any</option>
      ${cities.map(s=>`<option ${f.city===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
    <div class="fld"><label>Recipient type</label>
      <select onchange="f.type=this.value;render()"><option value="">Any</option>
      <option ${f.type==='Individual'?'selected':''}>Individual</option>
      <option ${f.type==='Organization'?'selected':''}>Organization</option></select></div>
    <div class="fld"><label>Minimum received</label>
      <select onchange="f.min=+this.value;render()">
      ${[0,300000,400000].map(v=>`<option value="${v}" ${f.min===v?'selected':''}>${
        v?money(v)+'+':'Any'}</option>`).join('')}</select></div>
    <span class="count">${rows.length} of ${PROVIDERS.length} providers</span>
  </div>
  <table>
    <thead><tr><th>#</th>${th('name','Provider')}${th('total','Received','num')}
      ${th('svc','Service fees','num')}${th('share','Top payer share','num')}
      ${th('cos','Companies','num')}<th>Largest payer</th></tr></thead>
    <tbody>${rows.map((p,i)=>`
      <tr>
        <td class="rk">${String(i+1).padStart(2,'0')}</td>
        <td><span class="nm">${esc(p.name)}</span>
          <div class="sub">${esc(p.spec)} · ${esc(p.city)}</div>
          <div class="chips">${p.type==='Organization'?'<span class="chip warn">Organization</span>':''}
            ${p.share>=95?'<span class="chip warn">Single payer</span>':''}
            ${p.svc>=80?'<span class="chip">Fee-heavy</span>':''}</div></td>
        <td class="num">${money(p.total)}</td>
        <td class="num">${p.svc}%</td>
        <td class="num">${p.share}%</td>
        <td class="num">${p.cos}</td>
        <td class="sub">${esc(p.top)}</td>
      </tr>`).join('')}</tbody>
  </table>
  <div class="note">Every column here is sortable and filterable because the data
    sits locally. None of these questions can be asked one lookup at a time.</div>`;
}

// --- overlap ---------------------------------------------------------------
function overlapView(){
  const rows = sortRows(OVERLAP);
  const max = Math.max(...OVERLAP.map(o=>o.shared));
  return `
  <div class="filters"><span class="count">${rows.length} company pairs with shared recipients</span></div>
  <table>
    <thead><tr><th>Company</th><th>Company</th>${th('shared','Providers paid by both','num')}
      <th>Relative size</th></tr></thead>
    <tbody>${rows.map(o=>`<tr>
      <td class="nm">${esc(o.a)}</td><td class="nm">${esc(o.b)}</td>
      <td class="num">${o.shared}</td>
      <td><span class="mini"><i style="width:${o.shared/max*100}%"></i></span>
        <span class="sub" style="margin-left:8px">${esc(o.note)}</span></td>
    </tr>`).join('')}</tbody>
  </table>
  <div class="note">Shared recipients mean two companies pay some of the same
    providers — usually because they sell into the same specialty. It is not a
    link between the companies, and not a link between the providers.</div>`;
}

function render(){
  app.innerHTML = view==='companies' ? companiesView()
                : view==='providers' ? providersView() : overlapView();
}
render();
</script>
</body>
</html>
